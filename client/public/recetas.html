<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="icon" href="./Resources/Logo.png" type="image/png" />
    <link rel="stylesheet" href="./CSS/estilosreceta.css" />
    <link rel="stylesheet" href="./CSS/estilosmodales.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>

  <body>
    <!--FONDO-->
    <div class="Fondo"></div>

    <!-- MENÚ LATERAL -->
    <aside class="Menu-lateral" id="menuLateral">
      <nav>
        <div class="Seccion-menu">CONTROL DE INVENTARIOS</div>

        <a href="productos.html" class="Item-menu">
          <i class="fa-solid fa-box-open"></i>
          <span>Productos</span>
        </a>

        <a href="materiaprima.html" class="Item-menu">
          <i class="fa-solid fa-boxes-stacked"></i>
          <span>Materia prima</span>
        </a>

        <a href="recetas.html" class="Item-menu activo">
          <i class="fa-solid fa-book-open"></i>
          <span>Recetas</span>
        </a>

        <hr />

        <div class="Seccion-menu">TABLERO DE VENTAS</div>

        <a href="ventas.html" class="Item-menu">
          <i class="fa-solid fa-cash-register"></i>
          <span>Ventas</span>
        </a>

        <!-- ADMINISTRACIÓN -->
        <div id="menuAdministracion" style="display: none">
          <hr />

          <div class="Seccion-menu">ADMINISTRACIÓN</div>

          <a href="usuarios.html" class="Item-menu">
            <i class="fa-solid fa-users"></i>
            <span>Usuarios</span>
          </a>

          <a href="respaldos.html" class="Item-menu">
            <i class="fa-solid fa-database"></i>
            <span>Respaldos</span>
          </a>
        </div>
      </nav>
    </aside>

    <!--ENCABEZADO-->
    <header class="Encabezado">
      <!--Izquierda-->
      <div class="Encabezado-izquierda">
        <button class="btnMenu" id="btnMenu" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="Marca">
          <h1>| RECETAS</h1>
        </div>
      </div>

      <!--Derecha-->
      <div class="Encabezado-derecha">
        <a href="agregarventa.html" class="btnVenta" id="btnVenta">
          <i class="fa-solid fa-plus"></i>
          <span>Agregar venta</span>
        </a>

        <a href="principal.html">
          <img src="Resources/Logo.png" alt="Logo" class="logoEmpresa" />
        </a>
      </div>
    </header>

    <main class="Contenido">
      <!--BUSCADOR DE RECETAS-->
      <section class="busqueda-recetas-tarjeta">
        <div class="busqueda-recetas">
          <!--Buscador-->
          <div class="contenedor-busqueda">
            <div class="campo-busqueda">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="search"
                id="buscar-receta"
                name="buscar-receta"
                placeholder="Escribe aquí el nombre de la receta (Ej.: Gelatina)" />
            </div>
            <button type="button" class="btnBuscar">↺ Buscar</button>
          </div>

          <!--Filtro-->
          <div class="contenedor-filtro">
            <label for="ingrediente"> FILTRAR POR </label>
            <select name="ingrediente" id="ingrediente">
              <option value="">Ingrediente</option>
            </select>
          </div>
        </div>
      </section>

      <div class="container mt-4">
        <div
          id="contenedor-recetas"
          class="row justify-content-center g-4"></div>
      </div>
    </main>

    <!--Modal de recetas. Muestra información de cada una-->
    <div
      class="modal fade"
      id="modalReceta"
      tabindex="-1"
      aria-labelledby="modalRecetaLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="venta-header">
            <h2
              class="modal-title titulo-modal"
              id="tituloModal"
              style="
                margin: 0;
                font-size: 30px;
                font-weight: 700;
                color: #4a7f83;
              "></h2>
            <button
              type="button"
              class="cerrarModal"
              data-bs-dismiss="modal"
              aria-label="Cerrar">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="modal-body" id="contenidoModal"></div>
        </div>
      </div>
    </div>

    <script src="./JavaScript/utilities/sesion.js"></script>

    <script>
      /* ========= Menú lateral ========= */

      const btnMenu = document.getElementById("btnMenu");
      const menuLateral = document.getElementById("menuLateral");

      btnMenu.addEventListener("click", () => {
        menuLateral.classList.toggle("activo");
        document.body.classList.toggle("menu-abierto");

        setTimeout(() => {
          if (typeof tabla !== "undefined") {
            tabla.redraw(true);
          }
        }, 300);
      });

      /* ========= Menú de administración ========= */

      async function configurarMenuAdministracion() {
        const usuarioActual = await verificarSesionYRedirigir();

        if (!usuarioActual) {
          return;
        }

        const menuAdministracion =
          document.getElementById("menuAdministracion");

        if (!menuAdministracion) {
          return;
        }

        if (usuarioActual.rol === "Administrador") {
          menuAdministracion.style.display = "block";
        } else {
          document.getElementById("btnVenta")?.remove();
        }
      }

      configurarMenuAdministracion();
    </script>

    <!--Scripts del proyecto-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./JavaScript/utilities/formateoUnidad.js"></script>
    <script src="./JavaScript/utilities/formateoUnidadesPlural.js"></script>
    <script src="./JavaScript/utilities/parsearCantidad.js"></script>
    <script src="./JavaScript/ModalesReceta/modalEditarReceta.js"></script>
    <script src="./JavaScript/recetas.js"></script>

    <!--Bootstrap-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>

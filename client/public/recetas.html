<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="icon" href="./Resources/Logo.png" type="image/png" />
    <link rel="stylesheet" href="./CSS/estilosreceta.css" />
    <link rel="stylesheet" href="./CSS/estilosproducto.css" />
    <link rel="stylesheet" href="./CSS/estilosmodales.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>

  <body>
    <!-- FONDO DE PANTALLA -->
    <div class="Fondo"></div>

    <!-- ENCABEZADO SUPERIOR -->
    <header class="Encabezado">
      <!-- Izquierda: Logo de la empresa -->
      <div class="Encabezado-izquierda">
        <a href="principal.html">
          <img src="Resources/Logo.png" alt="Logo Pa'tuboca" class="logoEmpresa" />
        </a>
      </div>

      <!-- Centro: Barra de navegación (Píldora) -->
      <nav class="nav-superior">
        <a href="productos.html" class="Item-nav">
          <i class="fa-solid fa-box-open"></i> Productos
        </a>
        <a href="materiaprima.html" class="Item-nav">
          <i class="fa-solid fa-boxes-stacked"></i> Materia prima
        </a>
        <a href="recetas.html" class="Item-nav activo">
          <i class="fa-solid fa-book-open"></i> Recetas
        </a>
        <a href="agregarventa.html" class="Item-nav">
          <i class="fa-solid fa-cart-plus"></i> Agregar venta
        </a>
        <a href="ventas.html" class="Item-nav">
          <i class="fa-solid fa-cash-register"></i> Ventas
        </a>

        <!-- Opción exclusiva para administradores -->
        <div id="menuAdministracion" class="nav-admin" style="display: none;">
          <span class="nav-separador">|</span>
          <a href="usuarios.html" class="Item-nav">
            <i class="fa-solid fa-users"></i> Usuarios
          </a>
          <a href="respaldos.html" class="Item-nav">
            <i class="fa-solid fa-database"></i> Respaldos
          </a>
        </div>
      </nav>

      <!-- Derecha: Botón Cerrar Sesión -->
      <div class="Encabezado-derecha">
        <button type="button" class="btn-logout" id="btnCerrarSesion">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </header>

    <main class="Contenido">
      
      <!--BUSCADOR DE RECETAS-->
      <section class="busqueda-recetas-tarjeta">
        <!-- CABECERA Y BUSCADOR DE RECETAS -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3"><div>
          <h1 style="color: #4a7f83 !important; font-size: 24px !important; font-weight: 700 !important; margin-bottom: 8px !important;">
          GESTIÓN DE RECETAS
          </h1>
          <p class="text-muted mb-0" style="font-size: 17px; color: #667 !important;">
          Consulta, busca y administra las recetas y sus ingredientes.</p>
        </div>

        <div class="busqueda-recetas">
          <!--Buscador-->
          <div class="contenedor-busqueda">
            <div class="campo-busqueda">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="search"
                id="buscar-receta"
                name="buscar-receta"
                placeholder="Escribe aquí el nombre de la receta (Ej.: Gelatina)" />
            </div>
            <button type="button" class="btnBuscar">↺ Buscar</button>
          </div>

          <!--Filtro-->
          <div class="contenedor-filtro">
            <label for="ingrediente"> FILTRAR POR </label>
            <select name="ingrediente" id="ingrediente">
              <option value="">Ingrediente</option>
            </select>
          </div>
        </div>
      </section>

      <div class="container mt-4">
        <div
          id="contenedor-recetas"
          class="row justify-content-center g-4"></div>
      </div>
    </main>

    <!--Modal de recetas. Muestra información de cada una-->
    <div
      class="modal fade"
      id="modalReceta"
      tabindex="-1"
      aria-labelledby="modalRecetaLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="venta-header">
            <h2
              class="modal-title titulo-modal"
              id="tituloModal"
              style="
                margin: 0;
                font-size: 30px;
                font-weight: 700;
                color: #4a7f83;
              "></h2>
            <button
              type="button"
              class="cerrarModal"
              data-bs-dismiss="modal"
              aria-label="Cerrar">
             
            </button>
          </div>

          <div class="modal-body" id="contenidoModal"></div>
        </div>
      </div>
    </div>

    <script src="./JavaScript/utilities/sesion.js"></script>

    <script>
      
      /* ========= Menú de administración ========= */

      async function configurarMenuAdministracion() {
        const usuarioActual = await verificarSesionYRedirigir();

        if (!usuarioActual) {
          return;
        }

        const menuAdministracion =
          document.getElementById("menuAdministracion");

        if (!menuAdministracion) {
          return;
        }

        if (usuarioActual.rol === "Administrador") {
          menuAdministracion.style.display = "flex";
        } else {
          document.getElementById("btnVenta")?.remove();
        }
      }

      configurarMenuAdministracion();

      const btnCerrarSesion = document.getElementById("btnCerrarSesion");
        if (btnCerrarSesion) {
          btnCerrarSesion.addEventListener("click", (e) => {
            e.preventDefault();
            if (typeof cerrarSesion === "function") {
              cerrarSesion();
            }
          });
        }
    </script>

    <!--Scripts del proyecto-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./JavaScript/utilities/formateoUnidad.js"></script>
    <script src="./JavaScript/utilities/formateoUnidadesPlural.js"></script>
    <script src="./JavaScript/utilities/parsearCantidad.js"></script>
    <script src="./JavaScript/ModalesReceta/modalEditarReceta.js"></script>
    <script src="./JavaScript/recetas.js"></script>

    <!--Bootstrap-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>

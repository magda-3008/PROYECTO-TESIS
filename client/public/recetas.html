<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥ Pa'TuBoca</title>

    <!-- CSS propio -->
    <link rel="stylesheet" href="./CSS/estilosreceta.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <!-- Fuente Baloo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>

  <body>
    <!-- Fondo -->
    <div class="Fondo"></div>

    <!-- ========================= -->
    <!-- MENÚ LATERAL -->
    <!-- ========================= -->

    <aside class="Menu-lateral" id="menuLateral">
      <nav>
        <div class="Seccion-menu">GESTIÓN</div>

        <a href="#" class="Item-menu">
          <i class="fa-solid fa-box-open"></i>
          <span>Productos</span>
        </a>

        <a href="#" class="Item-menu">
          <i class="fa-solid fa-carrot"></i>
          <span>Ingredientes</span>
        </a>

        <a href="recetas.html" class="Item-menu activo">
          <i class="fa-solid fa-book-open"></i>
          <span>Recetas</span>
        </a>

        <hr />

        <div class="Seccion-menu">TABLERO DE CONTROL</div>

        <a href="Ventas.html" class="Item-menu">
          <i class="fa-solid fa-cash-register"></i>
          <span>Ventas</span>
        </a>

        <a href="#" class="Item-menu">
          <i class="fa-solid fa-sack-dollar"></i>
          <span>Costos y Rentabilidad</span>
        </a>
      </nav>
    </aside>

    <!-- ========================= -->
    <!-- ENCABEZADO -->
    <!-- ========================= -->

    <header class="Encabezado">
      <!-- Izquierda -->
      <div class="Encabezado-izquierda">
        <button class="btnMenu" id="btnMenu" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="Marca">
          <h1>Pa'TuBoca | Recetas</h1>

          <p>Delicias y más</p>
        </div>
      </div>

      <!-- Derecha -->
      <div class="Encabezado-derecha">
        <button class="btnVenta" type="button">
          <i class="fa-solid fa-plus"></i>

          <span>Añadir venta</span>
        </button>

        <a href="" id="btnCerrarSesion">
          <img src="Resources/Logo.png" alt="Logo" class="logoEmpresa" />
        </a>
      </div>
    </header>

    <main class="Contenido">
      <!-- ========================= -->
      <!-- BUSCADOR DE RECETAS -->
      <!-- ========================= -->

      <section class="busqueda-recetas">
        <!-- Buscador -->
        <div class="contenedor-busqueda">
          <div class="campo-busqueda">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
              type="search"
              id="buscar-receta"
              name="buscar-receta"
              placeholder="Escribe aquí el nombre de la receta (Ej.: Gelatina)" />
          </div>

          <button type="button" class="btnBuscar">Buscar</button>
        </div>

        <!-- Filtro -->
        <div class="contenedor-filtro">
          <label for="ingrediente"> Filtrar por: </label>

          <select name="ingrediente" id="ingrediente">
            <option value="">Ingrediente</option>
          </select>
        </div>
      </section>
    </main>

    <div class="container mt-4">
      <div id="contenedor-recetas" class="row justify-content-center g-4"></div>
    </div>

    <!-- Modal de recetas. Muestra información de cada una -->
    <div
      class="modal fade"
      id="modalReceta"
      tabindex="-1"
      aria-labelledby="modalRecetaLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h2
              class="modal-title titulo-modal"
              id="tituloModal"
              style="text-align: center"></h2>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body" id="contenidoModal"></div>
        </div>
      </div>
    </div>

    <!-- ========================================= -->
    <!-- MODAL AGREGAR VENTA -->
    <!-- ========================================= -->

    <div class="modalVenta" id="modalVenta">
      <div class="modal-contenido">
        <!-- Encabezado -->
        <div class="venta-header">
          <h2>🛒 AGREGAR VENTA</h2>

          <button type="button" class="cerrarModal" id="cerrarModal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Buscar producto -->

        <div class="grupoBusqueda">
          <i class="fa-solid fa-magnifying-glass iconoBuscar"></i>

          <input
            type="text"
            class="buscarProducto"
            placeholder="Buscar producto..." />
        </div>

        <!-- Formulario -->

        <form class="formVenta">
          <div class="campo">
            <label>Nombre</label>

            <input type="text" readonly />
          </div>

          <div class="campo">
            <label>Cantidad</label>

            <input type="number" min="1" />
          </div>

          <div class="campo">
            <label>Precio</label>

            <input type="text" readonly />
          </div>

          <div class="campo">
            <label>Total</label>

            <input type="text" readonly />
          </div>
        </form>

        <!-- Botones -->

        <div class="modal-botones">
          <button type="button" class="btnCancelar" id="btnCancelar">
            Cancelar
          </button>

          <button type="submit" class="btnGuardar">Guardar</button>
        </div>
      </div>
    </div>

    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script>
      /* ========= Menú lateral ========= */

      const btnMenu = document.getElementById("btnMenu");
      const menuLateral = document.getElementById("menuLateral");

      btnMenu.addEventListener("click", () => {
        menuLateral.classList.toggle("activo");
        document.body.classList.toggle("menu-abierto");
      });

      /* ========= Modal Agregar Venta ========= */

      const modal = document.getElementById("modalVenta");
      const btnVenta = document.querySelector(".btnVenta");
      const cerrarModal = document.getElementById("cerrarModal");
      const btnCancelar = document.getElementById("btnCancelar");

      btnVenta.addEventListener("click", () => {
        modal.classList.add("activo");
      });

      cerrarModal.addEventListener("click", () => {
        modal.classList.remove("activo");
      });

      btnCancelar.addEventListener("click", (event) => {
        event.preventDefault();

        document.querySelector(".buscarProducto").value = "";

        document.querySelector(".formVenta").reset();

        document.querySelectorAll(".campo input[readonly]").forEach((input) => {
          input.value = "";
        });
      });
    </script>

    <!-- Scripts del proyecto -->
    <script src="./JavaScript/utilities/formateoUnidad.js"></script>

    <script src="./JavaScript/recetas.js"></script>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>

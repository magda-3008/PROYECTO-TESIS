<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="icon" href="./Resources/Logo.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link
      href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="./CSS/estilosusuarios.css" />
    <link rel="stylesheet" href="./CSS/tabulator-tema.css" />
    <link rel="stylesheet" href="./CSS/estilosmodales.css" />
    <link rel="stylesheet" href="./CSS/estilosproducto.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <!-- FONDO DE PANTALLA -->
    <div class="Fondo"></div>

    <!-- ENCABEZADO SUPERIOR -->
    <header class="Encabezado">
      <!-- Izquierda: Logo de la empresa -->
      <div class="Encabezado-izquierda">
        <a href="principal.html">
          <img
            src="Resources/Logo.png"
            alt="Logo Pa'tuboca"
            class="logoEmpresa" />
        </a>
      </div>

      <!-- Centro: Barra de navegación (Píldora) -->
      <nav class="nav-superior">
        <a href="productos.html" class="Item-nav">
          <i class="fa-solid fa-box-open"></i> Productos
        </a>
        <a href="materiaprima.html" class="Item-nav">
          <i class="fa-solid fa-boxes-stacked"></i> Materia prima
        </a>
        <a href="recetas.html" class="Item-nav">
          <i class="fa-solid fa-book-open"></i> Recetas
        </a>
        <a href="agregarventa.html" class="Item-nav">
          <i class="fa-solid fa-cart-plus"></i> Agregar venta
        </a>
        <a href="ventas.html" class="Item-nav">
          <i class="fa-solid fa-cash-register"></i> Ventas
        </a>
        <a href="usuarios.html" class="Item-nav">
          <i class="fa-solid fa-users"></i> Usuarios
        </a>
        <a href="respaldos.html" class="Item-nav">
          <i class="fa-solid fa-database"></i> Respaldos
        </a>

        <!-- Opción exclusiva para administradores -->
        <div id="menuAdministracion" class="nav-admin" style="display: none">
          <span class="nav-separador">|</span>
          <a href="usuarios.html" class="Item-nav activo">
            <i class="fa-solid fa-users"></i> Usuarios
          </a>
          <a href="respaldos.html" class="Item-nav">
            <i class="fa-solid fa-database"></i> Respaldos
          </a>
        </div>
      </nav>

      <!-- Derecha: Botón Cerrar Sesión -->
      <div class="Encabezado-derecha">
        <button type="button" class="btn-logout" id="btnCerrarSesion">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </header>

    <div class="container-fluid mt-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h1>GESTIÒN DE USUARIOS</h1>
          <p class="text-muted mb-0">
            Administra los usuarios y sus roles de acceso al sistema.
          </p>
        </div>
        <div>
          <button class="btnAgregarUsuario" id="btnAgregarUsuario">
            <i class="fa-solid fa-plus"></i>
            <span>Agregar usuario</span>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <input
          class="form-control"
          id="buscar"
          placeholder="Buscar usuario..." />
      </div>

      <!-- FILTROS -->
      <div id="panelFiltros" class="panel-filtros">
        <h3 style="color: #4a7f83; font-size: 20px; font-weight: 700">
          FILTRAR POR
        </h3>

        <div class="row g-2">
          <div class="col-md-3">
            <select id="filtroRol" class="form-select">
              <option value="">Todos los roles</option>
              <option value="Administrador">Administrador</option>
              <option value="Colaborador">Colaborador</option>
            </select>
          </div>
        </div>
      </div>

      <!-- TABLA -->
      <div id="tablaUsuarios"></div>
    </div>

    <div id="contenedorModalAgregarUsuario"></div>
    <div id="contenedorModalEditarUsuario"></div>

    <!-- Sesión -->
    <script src="./JavaScript/utilities/sesion.js"></script>

    <script>
      /* ========= Menú de administración ========= */

      async function configurarMenuAdministracion() {
        const usuarioActual = await verificarSesionYRedirigir();

        if (!usuarioActual) {
          return;
        }

        const menuAdministracion =
          document.getElementById("menuAdministracion");

        if (!menuAdministracion) {
          return;
        }

        if (usuarioActual.rol === "Administrador") {
          menuAdministracion.style.display = "block";
        } else {
          document.getElementById("btnVenta")?.remove();
        }
      }

      configurarMenuAdministracion();
    </script>

    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript de usuarios -->
    <script src="./JavaScript/ModalesUsuario/reautenticarUsuario.js"></script>
    <script src="./JavaScript/ModalesUsuario/modalAgregarUsuario.js"></script>
    <script src="./JavaScript/ModalesUsuario/modalEditarUsuario.js"></script>
    <script src="./JavaScript/usuarios.js"></script>
  </body>
</html>

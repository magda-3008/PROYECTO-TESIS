<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="icon" href="./Resources/Logo.png" type="image/png" />
    <link rel="stylesheet" href="./CSS/estilosprincipal.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <!-- Contenedor del video de fondo -->
    <div class="Fondo">
      <video autoplay muted loop playsinline class="video-fondo">
        <source src="Resources/UVides.mp4" type="video/mp4" />
        Tu navegador no soporta videos de fondo.
      </video>
      <div class="capa-overlay"></div>
    </div>

    <!-- ENCABEZADO -->
    <header class="Encabezado">
      <div class="Encabezado-derecha">
        <button type="button" class="btn-logout" id="btnCerrarSesion">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
      <!-- Cabecera: Título y Logo debajo -->
      <div class="titulo-contenedor">
        <h2 class="saludo">♥TODO LISTO PARA TRABAJAR HOY♥</h2>
        <img
          src="Resources/Logo.png"
          alt="Logo Pa'tuboca"
          class="logo-mediano" />
      </div>

      <!-- Apartado de gestión en filas de 3 -->
      <section>
        <div class="contenedor">
          <!-- Fila 1 -->
          <a href="productos.html" class="card">
            <div class="icono"><i class="fa-solid fa-box-open"></i></div>
            <span>PRODUCTOS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <a href="materiaprima.html" class="card">
            <div class="icono"><i class="fa-solid fa-boxes-stacked"></i></div>
            <span>MATERIA PRIMA</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <a href="recetas.html" class="card">
            <div class="icono"><i class="fa-solid fa-book-open"></i></div>
            <span>RECETAS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <!-- Fila 2 -->
          <a href="agregarventa.html" class="card" id="tarjetaAgregarVenta">
            <div class="icono"><i class="fa-solid fa-cart-plus"></i></div>
            <span>AGREGAR VENTA</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <a href="ventas.html" class="card">
            <div class="icono"><i class="fa-solid fa-cash-register"></i></div>
            <span>VENTAS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <a href="usuarios.html" class="card" id="tarjetaUsuarios">
            <div class="icono"><i class="fa-solid fa-user"></i></div>
            <span>USUARIOS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <!-- Fila 3 (RESPALDOS queda en la 2da columna, debajo de VENTAS) -->
          <div class="vacio"></div>
          <!-- Espacio transparente a la izquierda -->

          <a href="respaldos.html" class="card" id="tarjetaRespaldos">
            <div class="icono"><i class="fa-solid fa-database"></i></div>
            <span>RESPALDOS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>
        </div>
      </section>
    </main>

    <script src="./JavaScript/utilities/sesion.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const usuarioActual = await verificarSesionYRedirigir();

        if (!usuarioActual) {
          return;
        }

        if (usuarioActual.rol !== "Administrador") {
          document.getElementById("tarjetaUsuarios")?.remove();
          document.getElementById("tarjetaRespaldos")?.remove();
          document.getElementById("tarjetaAgregarVenta")?.remove();
        }
      });

      const btnCerrarSesion = document.getElementById("btnCerrarSesion");
      if (btnCerrarSesion) {
        btnCerrarSesion.addEventListener("click", (e) => {
          e.preventDefault();
          if (typeof cerrarSesion === "function") {
            cerrarSesion();
          }
        });
      }
    </script>
  </body>
</html>

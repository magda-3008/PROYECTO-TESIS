<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="stylesheet" href="./CSS/estilosprincipal.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <!-- Contenedor del video de fondo -->
    <div class="Fondo">
      <video autoplay muted loop playsinline class="video-fondo">
        <source src="Resources/Video 1.mp4" type="video/mp4" />
        Tu navegador no soporta videos de fondo.
      </video>
      <!-- Capa semitransparente opcional para que el texto resalte más -->
      <div class="capa-overlay"></div>
    </div>

    <!--ENCABEZADO-->
    <header class="Encabezado">
      <!--Derecha-->
      <div class="Encabezado-derecha">
        <button class="btnVenta" type="button">
          <i class="fa-solid fa-plus"></i>
          <span>Agregar venta</span>
        </button>

        <a href="" id="btnCerrarSesion">
          <img src="Resources/Logo.png" alt="Logo" class="logoEmpresa" />
        </a>
      </div>
    </header>

    <!--Contenido que esta bajo el header color rosa -->
    <main>
      <h2 class="saludo">TODO LISTO PARA TRABAJAR HOY</h2>

      <!-- Apartado de gestión -->
      <section>
        <div class="contenedor">
          <!-- Tarjeta Productos -->
          <!-- Tarjeta Productos -->
          <a href="productos.html" class="card">
            <div class="icono"><i class="fa-solid fa-box-open"></i></div>
            <span>PRODUCTOS</span
            ><i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <!-- Tarjeta Ingredientes -->
          <a href="materiaprima.html" class="card">
            <div class="icono"><i class="fa-solid fa-boxes-stacked"></i></div>
            <span>MATERIA PRIMA</span
            ><i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <!-- Tarjeta Recetas -->
          <a href="recetas.html" class="card">
            <div class="icono"><i class="fa-solid fa-book-open"></i></div>
            <span>RECETAS</span><i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <!-- Tarjeta Ventas -->
          <a href="ventas.html" class="card">
            <div class="icono"><i class="fa-solid fa-cash-register"></i></div>
            <span>VENTAS</span><i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <a href="usuarios.html" class="card" id="tarjetaUsuarios">
            <div class="icono">
              <i class="fa-solid fa-user"></i>
            </div>
            <span>USUARIOS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>

          <a href="respaldos.html" class="card" id="tarjetaRespaldos">
            <div class="icono">
              <i class="fa-solid fa-database"></i>
            </div>
            <span>RESPALDOS</span>
            <i class="fa-solid fa-chevron-right flecha"></i>
          </a>
        </div>
      </section>
    </main>

    <!--MODAL AGREGAR VENTA-->
    <div class="modalVenta" id="modalVenta">
      <div class="modal-contenido">
        <!--Encabezado-->
        <div class="venta-header">
          <h2><i class="fa-solid fa-cash-register"></i> AGREGAR VENTA</h2>

          <button type="button" class="cerrarModal" id="cerrarModal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!--Buscar producto-->
        <div class="grupoBusqueda">
          <i class="fa-solid fa-magnifying-glass iconoBuscar"></i>

          <input
            type="text"
            class="buscarProducto"
            placeholder="Buscar producto..." />
        </div>

        <!--Formulario-->
        <form class="formVenta">
          <div class="campo">
            <label>NOMBRE</label>

            <input type="text" />
          </div>

          <div class="campo">
            <label>CANTIDAD</label>

            <input type="number" min="1" />
          </div>

          <div class="campo">
            <label>PRECIO</label>

            <input type="text" />
          </div>

          <div class="campo">
            <label>TOTAL</label>

            <input type="text" />
          </div>
        </form>

        <!--Botones-->
        <div class="modal-botones">
          <button type="button" class="btnCancelar" id="btnCancelar">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>

          <button type="submit" class="btnGuardar">
            <i class="fa-solid fa-check"></i> Guardar
          </button>
        </div>
      </div>
    </div>

    <script src="./JavaScript/utilities/sesion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const usuarioActual = await verificarSesionYRedirigir();

        if (!usuarioActual) {
          return;
        }

        if (usuarioActual.rol !== "Administrador") {
          document.getElementById("tarjetaUsuarios")?.remove();

          document.getElementById("tarjetaRespaldos")?.remove();
        }

        const btnCerrarSesion = document.getElementById("btnCerrarSesion");

        if (btnCerrarSesion) {
          btnCerrarSesion.addEventListener("click", (event) => {
            event.preventDefault();

            cerrarSesion();
          });
        }

        // ==========================================
        // MODAL AGREGAR VENTA
        // ==========================================

        const modal = document.getElementById("modalVenta");

        const btnVenta = document.querySelector(".btnVenta");

        const cerrarModal = document.getElementById("cerrarModal");

        const btnCancelar = document.getElementById("btnCancelar");

        if (btnVenta && modal) {
          btnVenta.addEventListener("click", () => {
            modal.classList.add("activo");
          });
        }

        if (cerrarModal && modal) {
          cerrarModal.addEventListener("click", () => {
            modal.classList.remove("activo");
          });
        }

        if (btnCancelar) {
          btnCancelar.addEventListener("click", (event) => {
            event.preventDefault();

            const buscarProducto = document.querySelector(".buscarProducto");

            const formVenta = document.querySelector(".formVenta");

            if (buscarProducto) {
              buscarProducto.value = "";
            }

            if (formVenta) {
              formVenta.reset();
            }

            document
              .querySelectorAll(".campo input[readonly]")
              .forEach((input) => {
                input.value = "";
              });
          });
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="icon" href="./Resources/Logo.png" type="image/png" />
    <link rel="stylesheet" href="./CSS/estilosentrada.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  </head>

  <body>
    <main class="Contenedor-general">
      <!--Logo-->
      <div class="Contenedor-logo">
        <img
          src="Resources/Logo.png"
          alt="Logo de Pa'tuboca"
          class="logo-img" />
      </div>

      <h2>♥BIENVENIDOS♥</h2>

      <!--Formulario cuadrado y sus elementos-->
      <form id="loginForm">
        <div class="Titulo-caja">
          <label for="username">NOMBRE DE USUARIO</label>
          <input
            type="text"
            id="username"
            placeholder="Ingrese su nombre de usuario"
            required />
        </div>

        <div class="Titulo-caja">
          <label for="password">CONTRASEÑA</label>

          <div class="password-container">
            <input
              type="password"
              id="password"
              placeholder="Ingrese su contraseña"
              required />

            <button
              type="button"
              id="togglePassword"
              class="btn-ojo"
              aria-label="Mostrar contraseña">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <p id="mensajeLogin" class="mensaje-login"></p>

        <div class="Redondo">
          <button type="submit" class="btn-login">Iniciar sesión</button>
        </div>

        <br />

        <button type="button" id="btnRecuperarContrasena">
          ¿Olvidaste tu contraseña?
        </button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="./JavaScript/login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>♥Pa'tuboca Delicias y más♥</title>
    <link rel="icon" href="./Resources/Logo.png" type="image/png" />

    <link rel="stylesheet" href="./CSS/estilosagregarventas.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      zxxz
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <body>
    <!-- FONDO -->
    <div class="Fondo"></div>

    <!-- ENCABEZADO CON BARRA DE NAVEGACIÓN SUPERIOR -->
    <header class="Encabezado">
      <!-- Izquierda vacía o flexible -->
      <div class="Encabezado-izquierda">
        <!-- Espacio libre ya que retiramos el texto -->
      </div>

      <!-- Centro: Barra de navegación más ancha y espaciosa -->
      <nav class="nav-superior">
        <span class="nav-seccion"></span>
        <a href="productos.html" class="Item-nav">
          <i class="fa-solid fa-box-open"></i> Productos
        </a>
        <a href="materiaprima.html" class="Item-nav">
          <i class="fa-solid fa-boxes-stacked"></i> Materia prima
        </a>
        <a href="recetas.html" class="Item-nav">
          <i class="fa-solid fa-book-open"></i> Recetas
        </a>
        <a href="ventas.html" class="Item-nav">
          <i class="fa-solid fa-cash-register"></i> Ventas
        </a>
         <a href="agregarventa.html" class="Item-nav activo">
          <i class="fa-solid fa-plus"></i> Agregar venta
        </a>
        

        <!-- ADMINISTRACIÓN (Opcional según rol) -->
        <div id="menuAdministracion" class="nav-admin" style="display: none;">
          <span class="nav-separador">|</span>
          <a href="usuarios.html" class="Item-nav">
            <i class="fa-solid fa-users"></i> Usuarios
          </a>
          <a href="respaldos.html" class="Item-nav">
            <i class="fa-solid fa-database"></i> Respaldos
          </a>
        </div>
      </nav>

      <!-- Derecha: Logo de la empresa -->
      <div class="Encabezado-derecha">
        <a href="principal.html">
          <img src="Resources/Logo.png" alt="Logo" class="logoEmpresa" />
        </a>
      </div>
    </header>

    <div class="app-container">
      <main class="main">
        <div class="page-header">
          <h1>NUEVA VENTA</h1>

          <p>Selecciona los productos y agrega al carrito</p>
        </div>

        <!-- =================================
                 CONTENEDOR DE VENTA
            ================================== -->

        <div class="venta-container">
          <!-- =================================
                     PRODUCTOS
                ================================== -->

          <section class="productos-section">
            <!-- CATEGORÍAS -->

            <div class="categorias">
              <button class="categoria active" data-category="Todos">
                TODOS
              </button>

              <button class="categoria" data-category="Dulces">DULCES</button>

              <button class="categoria" data-category="Bebidas">BEBIDAS</button>

              <button class="categoria" data-category="Postres">POSTRES</button>
            </div>

            <!-- BUSCADOR -->

            <div class="buscador-container">
              <input
                type="text"
                id="buscador"
                class="buscador"
                placeholder="Buscar producto..." />

              <button class="btn-filtrar" id="btnFiltrar">☷ FILTRAR</button>
            </div>

            <!-- GRID DE PRODUCTOS -->

            <div class="productos-grid" id="productosGrid"></div>
          </section>

          <!-- =================================
                     CARRITO
                ================================== -->

          <section class="carrito-section">
            <!-- HEADER CARRITO -->

            <div class="carrito-header">
              <h2>🛒 CARRITO DE VENTAS</h2>

              <button class="btn-vaciar" id="btnVaciar">
                🗑 Vaciar carrito
              </button>
            </div>

            <!-- COLUMNAS -->

            <div class="carrito-columnas">
              <span> Producto </span>

              <span> Precio </span>

              <span> Cant. </span>

              <span> Subtotal </span>
            </div>

            <!-- PRODUCTOS DEL CARRITO -->

            <div class="carrito-items" id="carritoItems">
              <div class="carrito-vacio">
                <p>El carrito está vacío</p>

                <small> Agrega productos para comenzar una venta </small>
              </div>
            </div>

            <!-- =================================
                         RESUMEN
                    ================================== -->

            <div class="resumen">
              <!-- SUBTOTAL -->

              <div class="resumen-linea">
                <span> Subtotal </span>

                <strong id="subtotal"> C$ 0.00 </strong>
              </div>

              <!-- DESCUENTO -->

              <div class="resumen-linea descuento">
                <span> Descuento </span>

                <input type="number" id="descuento" value="0" min="0" />

                <strong id="descuentoMonto"> C$ 0.00 </strong>
              </div>

              <!-- TOTAL -->

              <div class="resumen-total">
                <span> Total </span>

                <strong id="total"> C$ 0.00 </strong>
              </div>
            </div>

            <div class="botones-venta">
              <button class="btn-cancelar" id="btnCancelar">
                <i class="fa-solid fa-xmark"></i> Cancelar
              </button>

              <button class="btn-guardar" id="btnGuardar">
                <i class="fa-solid fa-floppy-disk"></i> Guardar Venta
              </button>

              <button class="btn-finalizar" id="btnFinalizar">
                <i class="fa-solid fa-check"></i> Finalizar Venta
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- JAVASCRIPT -->
    <script>

    
      /* ========= Menú de administración ========= */

      async function configurarMenuAdministracion() {
        const usuarioActual = await verificarSesionYRedirigir();

        if (!usuarioActual) {
          return;
        }

        const menuAdministracion =
          document.getElementById("menuAdministracion");

        if (!menuAdministracion) {
          return;
        }

        if (usuarioActual.rol === "Administrador") {
          menuAdministracion.style.display = "block";
        } else {
          document.getElementById("btnVenta")?.remove();
        }
      }

      configurarMenuAdministracion();
    </script>

    <script src="./JavaScript/agregarVentas.js"></script>
  </body>
</html>
